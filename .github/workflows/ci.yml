name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # test:unit excludes e2e.test.js, which needs a live TradingView Desktop + CDP.
        run: npm run test:unit

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  phase16-guards:
    # Roadmap task A1. Structural protection for the Phase 16 held-out window:
    # the guard must fail closed and no bot/ code may depend on Phase 16 data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static guard check (no Phase 16 dependency)
        run: python3 bot/tools/check_guards.py

      - name: Golden fixtures match a fresh extraction (A2 determinism)
        run: python3 bot/tools/extract_golden.py --check

      - name: Guard and fixture unit tests
        # stdlib unittest — no third-party dependencies by design.
        run: python3 -m unittest discover -s bot/tests -t . -v
